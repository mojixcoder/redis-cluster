name: Test

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        id: install
        with:
          version: v4.3.1

      - name: Setup helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Setup kubeconform-helm
        run: |
          pip install pyyaml
          helm plugin install https://github.com/jtyr/kubeconform-helm --verify=false

      - name: Lint
        run: helm lint .

      - name: Unit tests
        run: helm unittest .

      - name: Schema validation
        run: helm kubeconform .
