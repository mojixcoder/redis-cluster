suite: redis config
templates:
  - configmap.yaml
tests:
  - it: should not configure an ACL file by default
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: aclfile
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: requirepass

  - it: should not configure an ACL file when auth is enabled without ACL
    set:
      auth:
        enabled: true
        password: placeholder-password
    asserts:
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: aclfile
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: placeholder-password

  - it: should configure the ACL file when ACL is enabled
    set:
      auth:
        enabled: true
        password: placeholder-password
        acl:
          enabled: true
          users:
            - name: app
              rules: "~* &* +@all"
              password: app-placeholder
    asserts:
      - matchRegex:
          path: data["redis.conf"]
          pattern: "(?m)^aclfile /data/redis/users.acl$"
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: placeholder

  - it: should reject requirepass in extraConfig
    set:
      extraConfig:
        requirepass: placeholder
    asserts:
      - failedTemplate:
          errorPattern: extraConfig.requirepass is managed by the chart

  - it: should reject masterauth in extraConfig even when auth is enabled
    set:
      auth:
        enabled: true
        password: placeholder-password
      extraConfig:
        masterauth: placeholder
    asserts:
      - failedTemplate:
          errorPattern: extraConfig.masterauth is managed by the chart

  - it: should reject masteruser in extraConfig
    set:
      extraConfig:
        masteruser: someone
    asserts:
      - failedTemplate:
          errorPattern: extraConfig.masteruser is managed by the chart

  - it: should reject aclfile in extraConfig
    set:
      extraConfig:
        aclfile: /etc/redis/users.acl
    asserts:
      - failedTemplate:
          errorPattern: extraConfig.aclfile is managed by the chart

  - it: should reject user directives in extraConfig
    set:
      extraConfig:
        user: "app on >placeholder ~* +@all"
    asserts:
      - failedTemplate:
          errorPattern: extraConfig.user is managed by the chart

  - it: should still accept unrelated extraConfig keys
    set:
      auth:
        enabled: true
        password: placeholder-password
      extraConfig:
        maxmemory: 100mb
    asserts:
      - matchRegex:
          path: data["redis.conf"]
          pattern: "(?m)^maxmemory 100mb$"
