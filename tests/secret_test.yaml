suite: auth secret
templates:
  - secret.yaml
tests:
  - it: should not render a secret when auth is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a secret with the default user password when auth.password is set
    set:
      auth:
        enabled: true
        password: placeholder-password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: redis-cluster-auth
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data["redis-password"]
          value: cGxhY2Vob2xkZXItcGFzc3dvcmQ=
      - notExists:
          path: data["acl-app-password"]

  - it: should not render a secret when an existing secret is used
    set:
      auth:
        enabled: true
        existingSecret:
          name: my-redis-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when auth is enabled without a password source
    set:
      auth:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: neither auth.password nor auth.existingSecret.name

  - it: should store inline ACL user passwords in the secret
    set:
      auth:
        enabled: true
        password: placeholder-password
        acl:
          enabled: true
          users:
            - name: app
              rules: "~app:* &* +@all -@dangerous"
              password: app-placeholder
            - name: reader
              rules: "~* +@read"
              existingSecret:
                name: reader-secret
                key: pw
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data["redis-password"]
          value: cGxhY2Vob2xkZXItcGFzc3dvcmQ=
      - equal:
          path: data["acl-app-password"]
          value: YXBwLXBsYWNlaG9sZGVy
      - notExists:
          path: data["acl-reader-password"]

  - it: should render a secret for ACL users even when the default user uses an existing secret
    set:
      auth:
        enabled: true
        existingSecret:
          name: my-redis-secret
        acl:
          enabled: true
          users:
            - name: app
              rules: "~* &* +@all"
              password: app-placeholder
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data["redis-password"]
      - equal:
          path: data["acl-app-password"]
          value: YXBwLXBsYWNlaG9sZGVy

  - it: should not render a secret when every password comes from existing secrets
    set:
      auth:
        enabled: true
        existingSecret:
          name: my-redis-secret
        acl:
          enabled: true
          users:
            - name: app
              rules: "~* &* +@all"
              existingSecret:
                name: app-secret
                key: password
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when ACL is enabled without auth
    set:
      auth:
        enabled: false
        acl:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: auth.acl.enabled requires auth.enabled

  - it: should fail when an ACL user has no rules
    set:
      auth:
        enabled: true
        password: placeholder-password
        acl:
          enabled: true
          users:
            - name: app
              password: app-placeholder
    asserts:
      - failedTemplate:
          errorPattern: rules

  - it: should fail when an ACL user has no password source
    set:
      auth:
        enabled: true
        password: placeholder-password
        acl:
          enabled: true
          users:
            - name: app
              rules: "~* &* +@all"
    asserts:
      - failedTemplate:
          errorPattern: password

  - it: should fail when an ACL user is named default
    set:
      auth:
        enabled: true
        password: placeholder-password
        acl:
          enabled: true
          users:
            - name: default
              rules: "~* &* +@all"
              password: app-placeholder
    asserts:
      - failedTemplate:
          errorPattern: default
