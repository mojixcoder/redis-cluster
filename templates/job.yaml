{{- if .Values.cluster.init }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redis-cluster.name" . }}-job
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "redis-cluster.labels" . | nindent 4 }}
spec:
  template:
    spec:
      restartPolicy: "OnFailure"
      initContainers:
        - name: ping-redises
          image: {{ .Values.cluster.waitImage }}
          command:
            - /bin/sh
            - /scripts/ping.sh
          {{- if .Values.auth.enabled }}
          env:
            {{- include "redis-cluster.passwordEnv" (dict "name" "REDIS_PASSWORD" "root" .) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      containers:
        - name: init-cluster
          image: {{ .Values.redis.image }}
          command:
            - /bin/bash
            - /scripts/init-cluster.sh
          {{- if .Values.auth.enabled }}
          env:
            {{- include "redis-cluster.passwordEnv" (dict "name" "REDISCLI_AUTH" "root" .) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes: 
        - name: scripts
          configMap:
            name: {{ include "redis-cluster.name" . }}-scripts
{{- end }}
