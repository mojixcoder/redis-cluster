{{- include "redis-cluster.validateAuth" . -}}
{{- if and .Values.auth.enabled (include "redis-cluster.createAuthSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis-cluster.authSecretDefaultName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "redis-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.auth.existingSecret.name }}
  redis-password: {{ .Values.auth.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.acl.enabled }}
  {{- range .Values.auth.acl.users }}
  {{- if not (and .existingSecret .existingSecret.name) }}
  {{ include "redis-cluster.aclSecretKey" .name }}: {{ .password | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
